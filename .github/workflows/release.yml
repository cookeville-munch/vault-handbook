name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install markdownlint-cli
        run: npm ci markdownlint-cli@0.38.0

      - name: Lint Markdown files
        run: npx markdownlint-cli '**/*.md' --ignore 'node_modules/**' --ignore 'modules/superpowers/**'

      - name: Lint YAML files
        run: |
          npm ci yaml-lint@1.3.0
          npx yaml-lint '**/*.yml' '**/*.yaml' --ignore 'node_modules/**' --ignore 'modules/superpowers/**'

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install axe-core CLI
        run: npm ci @axe-core/cli@4.8.0

      - name: Run accessibility audit on HTML files
        run: |
          # Find all HTML files (excluding superpowers submodule)
          find . -name "*.html" -not -path "./modules/superpowers/**" -not -path "./node_modules/**" | while read file; do
            echo "Auditing $file"
            npx axe "$file" --tags wcag2aa --save --dir ./axe-results || true
          done

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: axe-results/
          retention-days: 7

      - name: Check for critical violations
        run: |
          if find ./axe-results -name "*.json" -exec grep -l '"impact":"critical"' {} \; | grep -q .; then
            echo "::error::Critical accessibility violations found"
            exit 1
          fi

  mermaid:
    name: Validate Mermaid Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install mermaid-cli
        run: npm ci @mermaid-js/mermaid-cli@10.9.0

      - name: Validate Mermaid diagrams
        run: |
          find diagrams -name "*.js" -not -path "./modules/superpowers/**" | while read file; do
            echo "Validating $file"
            npx mmdc -i "$file" -o /dev/null --quiet || {
              echo "::error file=$file::Mermaid diagram validation failed"
              exit 1
            }
          done

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install markdown-link-check
        run: npm ci markdown-link-check@3.12.0

      - name: Check markdown links
        run: |
          find . -name "*.md" -not -path "./modules/superpowers/**" -not -path "./node_modules/**" | while read file; do
            echo "Checking links in $file"
            npx markdown-link-check "$file" --quiet --config .markdown-link-check.json || {
              echo "::warning file=$file::Broken links detected"
            }
          done

  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    needs: [lint, accessibility, mermaid, link-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install docsify
        run: npm ci docsify-cli@4.4.0

      - name: Build docs site
        run: |
          # Create temporary build directory
          mkdir -p ./build
          cp -r docs/* ./build/
          cp README.md ./build/
          # Build with docsify
          npx docsify build ./build --output ./build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: build/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [lint, accessibility, mermaid, link-check, build-docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%an)" $PREV_TAG..HEAD > CHANGELOG.md
          else
            git log --pretty=format:"- %s (%an)" > CHANGELOG.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            diagrams/*.svg
            diagrams/*.js

  notify:
    name: Notify Community
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Send Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 New release published: ${{ github.ref_name }}\n📦 Changes: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\"}" \
            "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Log release completion
        run: |
          echo "✅ Release ${{ github.ref_name }} completed successfully"
          echo "📋 Changelog available at: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"