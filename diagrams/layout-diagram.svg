<svg width="100%" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Scene Setup Zone -->
  <rect x="50" y="50" width="300" height="350" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="10"/>
  <text x="60" y="80" font-size="18" font-weight="bold" fill="#2e7d32">Scene Setup Zone</text>
  <rect x="70" y="100" width="260" height="50" fill="#fff" stroke="#4caf50" />
  <text x="80" y="130" font-size="14">Primary Impact Tools</text>
  <rect x="70" y="170" width="260" height="50" fill="#fff" stroke="#4caf50" />
  <text x="80" y="200" font-size="14">Backup Tools</text>
  <rect x="70" y="240" width="260" height="50" fill="#fff" stroke="#4caf50" />
  <text x="80" y="270" font-size="14">Safety Shears</text>
  <rect x="70" y="310" width="260" height="50" fill="#fff" stroke="#4caf50" />
  <text x="80" y="340" font-size="14">First Aid Kit</text>
  <rect x="70" y="380" width="260" height="50" fill="#fff" stroke="#4caf50" />
  <text x="80" y="410" font-size="14">Water/Blankets</text>
  
  <!-- Inspection Zone -->
  <rect x="380" y="50" width="300" height="350" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="390" y="80" font-size="18" font-weight="bold" fill="#f57c00">Inspection Zone</text>
  <rect x="400" y="100" width="260" height="50" fill="#fff" stroke="#ff9800" />
  <text x="410" y="130" font-size="14">Carabiners x4</text>
  <rect x="400" y="170" width="260" height="50" fill="#fff" stroke="#ff9800" />
  <text x="410" y="200" font-size="14">Rope 30ft x2</text>
  <rect x="400" y="240" width="260" height="50" fill="#fff" stroke="#ff9800" />
  <text x="410" y="270" font-size="14">Quick-links x6</text>
  <rect x="400" y="310" width="260" height="50" fill="#fff" stroke="#ff9800" />
  <text x="410" y="340" font-size="14">Anchor Verification</text>
  
  <!-- Emergency Zone -->
  <rect x="710" y="50" width="300" height="350" fill="#fce4ec" stroke="#c62828" stroke-width="2" rx="10"/>
  <text x="720" y="80" font-size="18" font-weight="bold" fill="#c62828">Emergency Access</text>
  <rect x="730" y="100" width="260" height="50" fill="#fff" stroke="#e91e63" />
  <text x="740" y="130" font-size="14">Phone/911 Access</text>
  <rect x="730" y="170" width="260" height="50" fill="#fff" stroke="#e91e63" />
  <text x="740" y="200" font-size="14">Emergency Release Tools</text>
  <rect x="730" y="240" width="260" height="50" fill="#fff" stroke="#e91e63" />
  <text x="740" y="270" font-size="14">Exit Path Clear</text>
  
  <!-- Arrows between zones -->
  <path d="M360 225 L380 225" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 225 L710 225" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Flow labels -->
  <text x="330" y="240" font-size="12" fill="#666">Verified</text>
  <text x="710" y="240" font-size="12" fill="#666">→</text>
</svg>