<svg width="100%" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Hardware Inspection Flowchart -->
  <rect x="50" y="50" width="150" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="60" y="80" font-size="14">Hardware Inspection</text>
  
  <rect x="220" y="50" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="230" y="80" font-size="14">Anchor Points</text>
  
  <rect x="450" y="50" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="460" y="80" font-size="14">Rated for 10x load?</text>
  
  <rect x="680" y="50" width="150" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="690" y="80" font-size="14">No corrosion/cracks?</text>
  
  <!-- Arrows -->
  <path d="M115 110 L200 110" stroke="#333" stroke-width="2"/>
  <path d="M220 110 L300 110" stroke="#333" stroke-width="2"/>
  <path d="M310 110 L380 110" stroke="#333" stroke-width="2"/>
  <path d="M390 110 L470 110" stroke="#333" stroke-width="2"/>
  
  <!-- Text for Yes/No -->
  <text x="400" y="140" font-size="12">Yes →</text>
  <text x="400" y="160" font-size="12">No → REJECT →</text>
  <path d="M410 140 L470 140" stroke="#333" stroke-width="2"/>
  <path d="M410 160 L470 160" stroke="#333" stroke-width="2"/>
  
  <rect x="470" y="150" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="480" y="180" font-size="14">Mounting hardware secure?</text>
  
  <rect x="750" y="150" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="760" y="180" font-size="14">Connection Hardware</text>
  
  <!-- Continue path -->
  <path d="M580 260 L650 260" stroke="#333" stroke-width="2"/>
  <rect x="650" y="250" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="660" y="280" font-size="14">Quick-links: Threads clean?</text>
  
  <path d="M770 260 L850 260" stroke="#333" stroke-width="2"/>
  <rect x="850" y="250" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="860" y="280" font-size="14">Rings: No deformation?</text>
  
  <path d="M960 260 L1030 260" stroke="#333" stroke-width="2"/>
  <rect x="1030" y="250" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="1040" y="280" font-size="14">Swivels: Rotate freely?</text>
  
  <rect x="1130" y="250" width="200" height="80" fill="#f0f0f0" stroke="#333" />
  <text x="1140" y="280" font-size="14">PASS</text>
</svg>